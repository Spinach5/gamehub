name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading 'v'); defaults to the workspace Cargo.toml version"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  BINARY: gamehub
  NFPM_VERSION: "2.48.0"
  APPIMAGE_TOOL_BASE: "https://github.com/AppImage/appimagetool/releases/download/continuous"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-check:
    name: Validate tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag, Cargo.toml and CHANGELOG agree
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "$cargo_version" ]; then
            echo "::error::Could not read the workspace version from Cargo.toml."
            exit 1
          fi
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}."
            exit 1
          fi
          if ! grep -Eq "^## v${version//./\\.}([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v${version}' section; add release notes before tagging."
            exit 1
          fi
          {
            echo "### Release checks"
            echo
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Cargo.toml: \`${cargo_version}\`"
            echo "- CHANGELOG.md: section found"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.arch }} packages
    needs: tag-check
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.tag-check.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Native builds inside Ubuntu 22.04 so every artifact targets glibc >= 2.35,
    # independent of the (newer) GitHub runner image's glibc.
    container:
      image: ubuntu:22.04
    # Container jobs default to sh (dash), which lacks `set -o pipefail`.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            nfpm_arch: amd64
            nfpm_tool_arch: x86_64
            appimage_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            nfpm_arch: arm64
            nfpm_tool_arch: arm64
            appimage_arch: aarch64
    steps:
      - name: Install build and packaging dependencies
        run: |
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config rpm \
            xz-utils zstd \
            libx11-6 libx11-xcb1 libxcb1 libxcb-shm0 libxcb-render0 libxcb-randr0 \
            libxcb-xfixes0 libxcb-shape0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            xvfb xauth libvulkan1 libegl1 mesa-vulkan-drivers fonts-noto-cjk

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.arch }}
          cache-on-failure: true

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          fi
          # Arch pkgver cannot contain '-' (nfpm treats the suffix as pkgrel).
          if ! printf '%s' "$version" | grep -Eq '^[0-9][0-9A-Za-z.+~_]*$'; then
            echo "::error::Invalid version '$version'; use a tag like v1.2.3."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --bin "${BINARY}"

      - name: Stage binary
        run: install -Dm755 "target/release/${BINARY}" "dist/bin/${BINARY}"

      - name: Build .deb, .rpm and pacman packages
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_ARCH: ${{ matrix.nfpm_arch }}
          PKG_ARCH_LABEL: ${{ matrix.arch }}
          PKG_MAINTAINER: ${{ github.repository_owner }} <noreply@github.com>
          PKG_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          NFPM_TOOL_ARCH: ${{ matrix.nfpm_tool_arch }}
        run: |
          set -euo pipefail
          # Release assets use GoReleaser arch labels (x86_64, arm64), not
          # package arch labels (amd64, arm64).
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_TOOL_ARCH}.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version
          nfpm package -f packaging/nfpm.yaml -p deb -t "dist/${BINARY}_${PKG_VERSION}_${PKG_ARCH_LABEL}.deb"
          nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/${BINARY}_${PKG_VERSION}_${PKG_ARCH_LABEL}.rpm"
          nfpm package -f packaging/nfpm.yaml -p archlinux -t "dist/${BINARY}_${PKG_VERSION}_${PKG_ARCH_LABEL}.pkg.tar.zst"

      - name: Build .tar.xz
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH_LABEL: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          stage="dist/${BINARY}_${VERSION}_linux_${ARCH_LABEL}"
          install -d "$stage"
          install -m755 "target/release/${BINARY}" "$stage/${BINARY}"
          install -m644 packaging/gamehub.desktop "$stage/gamehub.desktop"
          install -m644 packaging/gamehub.svg "$stage/gamehub.svg"
          install -m644 README.md "$stage/README.md"
          tar -C dist -cJf "dist/${BINARY}_${VERSION}_linux_${ARCH_LABEL}.tar.xz" "$(basename "$stage")"

      - name: Build .AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH_LABEL: ${{ matrix.arch }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          set -euo pipefail
          appdir="${RUNNER_TEMP}/AppDir"
          rm -rf "$appdir"
          install -Dm755 "target/release/${BINARY}" "$appdir/usr/bin/${BINARY}"
          install -Dm644 packaging/gamehub.desktop "$appdir/gamehub.desktop"
          install -Dm644 packaging/gamehub.desktop "$appdir/usr/share/applications/gamehub.desktop"
          install -Dm644 packaging/gamehub.svg "$appdir/gamehub.svg"
          install -Dm644 packaging/gamehub.svg "$appdir/usr/share/icons/hicolor/scalable/apps/gamehub.svg"
          ln -s gamehub.svg "$appdir/.DirIcon"
          install -Dm755 packaging/AppRun "$appdir/AppRun"

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /tmp/appimagetool "${APPIMAGE_TOOL_BASE}/appimagetool-${APPIMAGE_ARCH}.AppImage"
          chmod +x /tmp/appimagetool

          ARCH="$APPIMAGE_ARCH" APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool --no-appstream \
            "$appdir" "dist/${BINARY}_${VERSION}_${ARCH_LABEL}.AppImage"

      - name: Verify package contents and metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH_LABEL: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          deb="dist/${BINARY}_${VERSION}_${ARCH_LABEL}.deb"
          rpmf="dist/${BINARY}_${VERSION}_${ARCH_LABEL}.rpm"
          pac="dist/${BINARY}_${VERSION}_${ARCH_LABEL}.pkg.tar.zst"
          tarball="dist/${BINARY}_${VERSION}_linux_${ARCH_LABEL}.tar.xz"
          appimage="dist/${BINARY}_${VERSION}_${ARCH_LABEL}.AppImage"

          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          rpm -qpi "$rpmf"
          rpm -qp --requires "$rpmf"
          tar --zstd -xOf "$pac" .PKGINFO
          tar -tJf "$tarball"
          file "$deb" "$rpmf" "$pac" "$tarball" "$appimage"

          appimage_abs="$(readlink -f "$appimage")"
          tmp="$(mktemp -d)"
          ( cd "$tmp" && APPIMAGE_EXTRACT_AND_RUN=1 "$appimage_abs" --appimage-extract >/dev/null )
          test -x "$tmp/squashfs-root/usr/bin/${BINARY}"
          test -f "$tmp/squashfs-root/${BINARY}.desktop"
          rm -rf "$tmp"

      - name: Smoke test GUI startup
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH_LABEL: ${{ matrix.arch }}
        run: |
          set +e
          appimage="$(readlink -f "dist/${BINARY}_${VERSION}_${ARCH_LABEL}.AppImage")"
          file "$appimage"
          xvfb-run -a sh -c 'echo "xvfb-run ok, DISPLAY=$DISPLAY"' || echo "xvfb-run sanity check exited with $?"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 25s "$appimage" > /tmp/gamehub-smoke.log 2>&1
          rc=$?
          set -e
          cat /tmp/gamehub-smoke.log || true
          if [ "$rc" -eq 124 ]; then
            echo "Smoke test OK: gameHub stayed alive for 25s."
          else
            tmp="$(mktemp -d)"
            ( cd "$tmp" && APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null 2>&1 )
            file "$tmp/squashfs-root/usr/bin/${BINARY}" || true
            ldd "$tmp/squashfs-root/usr/bin/${BINARY}" || true
            rm -rf "$tmp"
            # Surface the failure in an annotation so it is visible without
            # expanding the raw job log.
            detail="$( { cat /tmp/gamehub-smoke.log 2>/dev/null; echo; ldd --version 2>&1 | head -n1; } | tr '\n' ' ' | tr -d '\r' | head -c 1500 | sed 's/%/%25/g' )"
            echo "::warning title=Smoke test exit ${rc}::${detail}"
          fi

      - name: Write build summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH_LABEL: ${{ matrix.arch }}
        run: |
          {
            echo "### gameHub ${VERSION} · ${ARCH_LABEL}"
            echo
            echo "| Artifact | Size | SHA-256 |"
            echo "| --- | ---: | :--- |"
            while IFS= read -r file; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$file")" \
                "$(du -h "$file" | cut -f1)" \
                "$(sha256sum "$file" | cut -d' ' -f1)"
            done < <(find dist -maxdepth 1 -type f | sort)
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gamehub-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.tar.xz

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: gamehub-*
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          cd dist
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi
          sha256sum "${assets[@]}" > "gamehub_${VERSION}_SHA256SUMS"
          cat "gamehub_${VERSION}_SHA256SUMS"

      - name: Render release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 .github/scripts/render_release_notes.py \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --changelog CHANGELOG.md \
            --dist dist \
            --output "$RUNNER_TEMP/release-body.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: dist/gamehub_${{ steps.version.outputs.value }}_SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
          BODY: ${{ runner.temp }}/release-body.md
        run: |
          set -euo pipefail

          # Keep the "latest" badge on the highest semver; a rerun of an older
          # tag must not move it backwards.
          latest_flag=(--latest=false)
          if [ "$PRERELEASE" != "true" ]; then
            current_latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)"
            if [ -z "$current_latest" ]; then
              latest_flag=(--latest)
            else
              highest="$(printf '%s\n%s\n' "${current_latest#v}" "$VERSION" | sort -V | tail -n1)"
              if [ "$highest" = "$VERSION" ]; then
                latest_flag=(--latest)
              fi
            fi
          fi

          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi

          # Create the release as a draft, upload every asset, then publish so
          # users never see a half-populated release.
          if gh release view --repo "$GITHUB_REPOSITORY" "$TAG" >/dev/null 2>&1; then
            gh release edit --repo "$GITHUB_REPOSITORY" "$TAG" --title "$TITLE" --notes-file "$BODY" "${prerelease_flag[@]}"
          else
            gh release create --repo "$GITHUB_REPOSITORY" "$TAG" --title "$TITLE" --notes-file "$BODY" \
              --draft --verify-tag "${prerelease_flag[@]}"
          fi

          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" "${assets[@]}" --clobber

          gh release edit --repo "$GITHUB_REPOSITORY" "$TAG" --draft=false "${latest_flag[@]}" "${prerelease_flag[@]}"

      - name: Write release summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Release ${TAG}"
            echo
            echo "Published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "| Asset | Size | SHA-256 |"
            echo "| --- | ---: | :--- |"
            while IFS= read -r file; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$file")" \
                "$(du -h "$file" | cut -f1)" \
                "$(sha256sum "$file" | cut -d' ' -f1)"
            done < <(find dist -maxdepth 1 -type f | sort)
          } >> "$GITHUB_STEP_SUMMARY"
